<!DOCTYPE html>
<html>
<head>
    <title>Product Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-stone-100">

    <!-- Header -->
    <header class="bg-stone-700 text-white p-4">
        <h1 class="text-2xl font-bold">MyStore</h1>
    </header>

    <!-- Products -->
    <div class="p-6">
        <h2 class="text-2xl text-center mb-6 font-semibold text-stone-800">
            Our Products
        </h2>

        <div class="flex flex-wrap justify-center gap-5">

            <!-- Product 1 -->
            <div class="bg-white p-4 w-60 rounded shadow">
                <img src="lapttop.png" alt="Laptop"
                     class="w-full h-36 object-contain">
                <h3 class="text-lg font-semibold mt-3">Laptop</h3>
                <p class="text-stone-600">Price: ₹45,999</p>
                <button class="bg-green-700 text-white px-4 py-2 mt-3 rounded">
                    Buy Now
                </button>
            </div>

            <!-- Product 2 -->
            <div class="bg-white p-4 w-60 rounded shadow">
                <img src="mobbile.png" alt="Mobile"
                     class="w-full h-36 object-contain">
                <h3 class="text-lg font-semibold mt-3">Mobile</h3>
                <p class="text-stone-600">Price: ₹19,999</p>
                <button class="bg-green-700 text-white px-4 py-2 mt-3 rounded">
                    Buy Now
                </button>
            </div>

            <!-- Product 3 -->
            <div class="bg-white p-4 w-60 rounded shadow">
                <img src="shoes.png" alt="Shoes"
                     class="w-full h-36 object-contain">
                <h3 class="text-lg font-semibold mt-3">Shoes</h3>
                <p class="text-stone-600">Price: ₹2,499</p>
                <button class="bg-green-700 text-white px-4 py-2 mt-3 rounded">
                    Buy Now
                </button>
            </div>

            <!-- Product 4 -->
            <div class="bg-white p-4 w-60 rounded shadow">
                <img src="watch.png" alt="Watch"
                     class="w-full h-36 object-contain">
                <h3 class="text-lg font-semibold mt-3">Watch</h3>
                <p class="text-stone-600">Price: ₹3,499</p>
                <button class="bg-green-700 text-white px-4 py-2 mt-3 rounded">
                    Buy Now
                </button>
            </div>

            <!-- Product 5 -->
            <div class="bg-white p-4 w-60 rounded shadow">
                <img src="earbuds.png" alt="Earbuds"
                     class="w-full h-36 object-contain">
                <h3 class="text-lg font-semibold mt-3">Earbuds</h3>
                <p class="text-stone-600">Price: ₹1,499</p>
                <button class="bg-green-700 text-white px-4 py-2 mt-3 rounded">
                    Buy Now
                </button>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-stone-700 text-white text-center p-4 mt-4">
        MyStore © 2026 product website
    </footer>

</body>
</html>
